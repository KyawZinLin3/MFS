name: mfs-operations-portal
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mfs_portal}
      POSTGRES_USER: ${POSTGRES_USER:-mfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mfs} -d ${POSTGRES_DB:-mfs_portal}"]
      interval: 5s
      timeout: 5s
      retries: 15

  object-storage:
    image: rustfs/rustfs:1.0.3
    command: ["/data"]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-mfs-local-access}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-mfs-local-secret-change-this}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mfs}:${POSTGRES_PASSWORD:-change-this-local-password}@postgres:5432/${POSTGRES_DB:-mfs_portal}?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-at-least-32-characters}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-replace-with-a-different-long-random-secret}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      S3_ENDPOINT: http://object-storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_BUCKET: mfs-private
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mfs-local-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mfs-local-secret-change-this}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: mfs-portal-api
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  client-pwa:
    build:
      context: .
      dockerfile: apps/client-pwa/Dockerfile
    restart: unless-stopped
    ports:
      - "${CLIENT_PWA_PORT:-8081}:80"

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.4.2
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./ops/promtail.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - loki
    ports:
      - "4317:4317"
      - "4318:4318"

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - loki

volumes:
  postgres_data:
  rustfs_data:
  loki_data:
  grafana_data:
  promtail_positions:
