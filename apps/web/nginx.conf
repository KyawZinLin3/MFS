server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
  location /api/ { proxy_pass http://${API_UPSTREAM}/api/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /health { proxy_pass http://${API_UPSTREAM}/health; }
  location / { try_files $uri $uri/ /index.html; }
}
