server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
  location = /sw.js { default_type application/javascript; add_header Service-Worker-Allowed / always; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
